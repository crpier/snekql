name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_CONTEXT_AWARE_WARNINGS: "1"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Install MariaDB 12
        run: |
          curl -fsSL https://r.mariadb.com/downloads/mariadb_repo_setup \
            | sudo bash -s -- --mariadb-server-version=mariadb-12.rolling
          sudo apt-get update
          sudo apt-get install --yes mariadb-client mariadb-server tzdata-legacy
          sudo systemctl stop mariadb.service || true
          mariadbd --version
      - name: Sync locked environment
        run: uv sync --locked --all-extras
      - name: Record environment
        run: |
          uv run python - <<'PYTHON'
          import platform
          import sqlite3
          import sys
          print(sys.version)
          print(platform.platform())
          print("SQLite", sqlite3.sqlite_version)
          PYTHON
      - name: Test
        run: uv run snektest tests
      - name: Type check
        run: uv run ty check
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Generated interface check
        run: uv run python scripts/generate_query_overloads.py --check
      - name: Lock check
        run: uv lock --check
      - name: Build clean artifacts
        run: |
          rm -f dist/*.whl dist/*.tar.gz
          uv build
      - name: Isolated artifact smoke test
        run: uv run python scripts/check_artifacts.py

  mariadb-releases:
    name: MariaDB ${{ matrix.release }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ["10.11", "11.4", "11.8", "12.2", "12.3"]
    env:
      MARIADB_RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install 3.14
      - name: Sync locked environment
        run: uv sync --locked --all-extras
      - name: Install target MariaDB release
        run: |
          curl -fsSL https://r.mariadb.com/downloads/mariadb_repo_setup \
            | sudo bash -s -- --mariadb-server-version="mariadb-${MARIADB_RELEASE}"
          sudo apt-get update
          sudo apt-get install --yes mariadb-client mariadb-server tzdata-legacy
          sudo systemctl stop mariadb.service || true
          mariadbd --version | tee mariadb-version.txt
          RELEASE_PATTERN="${MARIADB_RELEASE//./[.]}"
          grep -E "(^|[^0-9])${RELEASE_PATTERN}[.]" mariadb-version.txt
      - name: Record environment
        run: |
          uv run python - <<'PYTHON'
          import platform
          import sqlite3
          import sys
          print(sys.version)
          print(platform.platform())
          print("SQLite", sqlite3.sqlite_version)
          PYTHON
      - name: Full integration suite on target MariaDB
        run: uv run snektest tests

  sqlite-environments:
    name: SQLite / ${{ matrix.os }} / ${{ matrix.python-source }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-source: system-library
            sqlite: 3.45.1
          - os: ubuntu-24.04
            python-source: managed
            sqlite: 3.50.4
          - os: macos-15
            python-source: managed
            sqlite: 3.50.4
          - os: windows-2025
            python-source: managed
            sqlite: 3.50.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.26"
          enable-cache: true
      - uses: actions/setup-python@v6
        if: matrix.python-source == 'system-library'
        id: system-python
        with:
          python-version: "3.14.2"
      - name: Sync system-library Python
        if: matrix.python-source == 'system-library'
        env:
          UV_PYTHON: ${{ steps.system-python.outputs.python-path }}
        run: uv sync --locked --all-extras
      - name: Sync managed Python
        if: matrix.python-source == 'managed'
        env:
          UV_PYTHON_PREFERENCE: only-managed
        run: |
          uv python install 3.14.2
          uv sync --locked --all-extras --python 3.14.2
      - name: Verify actual environment
        env:
          EXPECTED_SQLITE: ${{ matrix.sqlite }}
        run: |
          uv run python - <<'PYTHON'
          import asyncio
          import os
          import platform
          import sqlite3
          import sys
          print(sys.version)
          print(platform.platform(), platform.machine())
          print("SQLite", sqlite3.sqlite_version)
          assert sqlite3.sqlite_version == os.environ["EXPECTED_SQLITE"]
          assert sys._is_gil_enabled()
          with asyncio.Runner() as runner:
              print("Event loop", type(runner.get_loop()).__module__, type(runner.get_loop()).__name__)
          PYTHON
      - name: SQLite backend and shared lifecycle contracts
        run: |
          uv run snektest tests/sqlite \
            'tests/runtime/test_raw_lifecycle.py::raw_deadline_discards_blocked_connection[sqlite]' \
            'tests/runtime/test_raw_lifecycle.py::raw_native_cancellation_releases_pool_capacity[sqlite]' \
            tests/runtime/test_pool_telemetry.py::discarded_connection_holds_capacity_until_close
