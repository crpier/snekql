name: Service soak

on:
  workflow_dispatch:
    inputs:
      duration:
        description: Measured seconds per target (1 to 3000)
        type: number
        default: 1800
        required: true

permissions:
  contents: read

jobs:
  service-soak:
    name: Service / ${{ matrix.backend }} / pool ${{ matrix.pool }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, mariadb]
        pool: [1, 4]
    env:
      PYTHON_CONTEXT_AWARE_WARNINGS: '1'
      DURATION: ${{ inputs.duration }}
      BACKEND: ${{ matrix.backend }}
      POOL_SIZE: ${{ matrix.pool }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.13.0'
      - name: Install MariaDB LTS target
        if: matrix.backend == 'mariadb'
        run: |
          curl -fsSL https://r.mariadb.com/downloads/mariadb_repo_setup \
            | sudo bash -s -- --mariadb-server-version=mariadb-11.4
          sudo apt-get update
          sudo apt-get install --yes mariadb-client mariadb-server tzdata-legacy
          sudo systemctl stop mariadb.service || true
          mariadbd --version
      - name: Sync environment
        run: |
          uv python install 3.15.0
          uv sync --locked --all-extras --python 3.15.0
      - name: Run long-lived workload
        run: |
          uv run python -c 'import math, os; value=float(os.environ["DURATION"]); assert math.isfinite(value) and 1 <= value <= 3000'
          mkdir -p "$RUNNER_TEMP/service-soak"
          status=0
          TMPDIR="$RUNNER_TEMP/service-soak" uv run python -m soak.service \
            --backend "$BACKEND" --pool-size "$POOL_SIZE" --workers 16 \
            --duration "$DURATION" --warmup 10 --sample-interval 10 \
            --rows 257 --batch-size 32 --slow-consumer 0.005 \
            --burst-interval 1 --seed 538 \
            > service.jsonl 2> service.stderr || status=$?
          printf '%s\n' "$status" > service.status
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: service-soak-${{ matrix.backend }}-pool-${{ matrix.pool }}
          path: |
            service.jsonl
            service.stderr
            service.status
          retention-days: 14
